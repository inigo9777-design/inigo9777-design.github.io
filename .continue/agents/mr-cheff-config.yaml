name: Mr Cheff Config
version: 1.0.0
schema: v1
models:
  - name: qwen3.5:9b-mlx
    provider: ollama
    model: qwen3.5:9b-mlx
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 65000
      maxTokens: 30000
    capabilities:
      - tool_use
      - image_input
      - thinking
  - name: qwen3.8:27b-mlx
    provider: ollama
    model: qwen3.8:27b-mlx
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 100000
      maxTokens: 64000
    capabilities:
       - tool_use        # Llamada de herramientas
       - image_input     # Comprensión de imágenes
       - thinking       # Modo de razonamiento extendido -
  - name: qwen3.8:27b-mlx-fast
    provider: ollama
    model: qwen3.8:27b-mlx-fast
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 32000
      maxTokens: 22000
    capabilities:
       - tool_use        
       - image_input  
       - thinking   
  - name: Autodetect
    provider: ollama
    model: AUTODETECT

file_context_size: large
auto_import_files: true
